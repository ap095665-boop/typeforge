button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}.text-input{outline:0}

.topbar-right{display:flex;align-items:center;gap:10px}
.stats-pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;color:var(--muted);transition:.2s}.stats-pill.clickable:hover{border-color:var(--cyan);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.create-btn,.commit-btn{font-family:var(--mono);font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04060a;border-radius:var(--r);transition:.2s}.create-btn{font-size:12px;padding:8px 18px}.commit-btn{font-size:13px;padding:12px;text-align:center;margin-top:10px}.create-btn:hover,.commit-btn:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(72,232,255,.35)}
#mainContainer{max-width:620px;margin:0 auto;padding:80px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:40px}
#feedStream{width:100%;display:flex;flex-direction:column;align-items:center;gap:36px}
.feed-card{width:100%;max-width:520px;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.card-meta,.card-info{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015);font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.card-canvas-wrap{position:relative;width:100%;aspect-ratio:9/16;background:#000;overflow:hidden}.card-canvas-wrap canvas{width:100%;height:100%;display:block}

/* ACTION ROW (Voice Note, Site Link, Like, Share) */

.form-title{font-family:var(--disp);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.close-drawer{font-size:20px;cursor:pointer;color:var(--muted)}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.text-input{border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;background:rgba(255,255,255,.02);transition:.15s}.text-input:focus{border-color:var(--cyan);background:rgba(72,232,255,.03)}textarea.text-input{resize:vertical;min-height:54px}select.text-input{background:#080c14}
.swatch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.swatch{border:1px solid var(--line);border-radius:var(--r);padding:7px 4px;text-align:center;font-size:9px;color:var(--muted);cursor:pointer;transition:.15s}.swatch.active{border-color:var(--cyan);color:#e7edf6;box-shadow:0 0 8px rgba(72,232,255,.25)}.swatch .prev{height:18px;border-radius:2px;margin-bottom:4px}

.rec-wrap{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.01)}

#scrollSentinel{height:60px;width:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-solid);border:1px solid var(--line-strong);padding:10px 18px;border-radius:var(--r);font-size:12px;opacity:0;transition:.25s;z-index:300;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.preview-phone{max-width:140px}
.creator-form{padding:16px}

</style>

<script>
"use strict";

/* =========================================================================
   1. SUPABASE CLIENT
   ========================================================================= */
const SUPABASE_URL = 'https://ldrwqpusfnssbzvqthfp.sb.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcndxcHVzZm5zc2J6dnF0aGZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzUxMDYsImV4cCI6MjEwMzk1MTEwNn0.t4B5plmjqt25A6bXN7i95i5u9wuBJjjiV-JS97YwQk0';

const sb = (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* =========================================================================
   2. MATHEMATICS & CANVAS CORE ENGINE
   ========================================================================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => 1 + (2.70158) * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
function rand(seed) { let x = Math.sin(seed * 12989.123) * 43758.5453; return x - Math.floor(x); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

const THEMES = {
  cyber: { name: "CYBER NEON", accent: "#48e8ff", accent2: "#ff2ad4", bg: "#050711", text: "#fff", tagBg: "#ff2ad4" },
  gold: { name: "LUXURY GOLD", accent: "#ffd066", accent2: "#fff", bg: "#08080a", text: "#fbf5e6", tagBg: "#ffd066" },
  matrix: { name: "TERMINAL", accent: "#39ff6a", accent2: "#0aff9d", bg: "#030804", text: "#d6ffe3", tagBg: "#39ff6a" },
  acid: { name: "STREET ACID", accent: "#d9ff00", accent2: "#00f7ff", bg: "#090a0d", text: "#f3f4f6", tagBg: "#d9ff00" },
  crimson: { name: "HYPER RED", accent: "#ff3355", accent2: "#ff9900", bg: "#0c0305", text: "#fff", tagBg: "#ff3355" },
  minimal: { name: "SWISS MONO", accent: "#fff", accent2: "#808999", bg: "#060608", text: "#fff", tagBg: "#fff" }
};

const BACKGROUNDS = {
  warp: {
    name: "WARP DUST",
    draw(c, w, h, t, T) {
      c.fillStyle = T.bg;
      c.fillRect(0, 0, w, h);
      let cx = w / 2, cy = h / 2;
      for (let i = 0; i < 90; i++) {
        let s = i * 4.13, sp = .5 + rand(s) * 1.2, z = (rand(s + 1) + t * .35 * sp) % 1, a = rand(s + 2) * Math.PI * 2, d = Math.pow(z, 2.2) * Math.max(w, h) * .75, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
        c.fillStyle = rand(s + 3) > .4 ? T.accent : T.accent2;
        c.globalAlpha = Math.min(1, z * 1.5);
        c.beginPath();
        c.arc(x, y, Math.max(1, z * 3.8), 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
    }
  },
  grid: {
    name: "RETRO GRID",
    draw(c, w, h, t, T) {
      c.fillStyle = T.bg;
      c.fillRect(0, 0, w, h);
      let hor = h * .46, s = (t * .2) % 1;
      c.strokeStyle = T.accent;
      c.lineWidth = 1.4;
      for (let i = 0; i < 14; i++) {
        let p = (i / 14 + s) % 1, y = hor + Math.pow(p, 2.4) * (h - hor);
        c.globalAlpha = (1 - p) * .35;
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(w, y);
        c.stroke();
      }
      for (let i = -6; i <= 6; i++) {
        c.globalAlpha = .18;
        c.beginPath();
        c.moveTo(w / 2 + i * w * .03, hor);
        c.lineTo(w / 2 + i * w * .3, h);
        c.stroke();
      }
      c.globalAlpha = 1;
    }
  },
  clouds: {
    name: "AURORA NEBULA",
    draw(c, w, h, t, T) {
      c.fillStyle = T.bg;
      c.fillRect(0, 0, w, h);
      for (let i = 0; i < 4; i++) {
        let x = (rand(i * 5) * w + Math.sin(t * .2 + i) * 60) % w, y = (rand(i * 9) * h + Math.cos(t * .25 + i) * 60) % h, r = 80 + rand(i * 3) * 120, g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, i % 2 ? T.accent : T.accent2);
        g.addColorStop(1, "transparent");
        c.globalAlpha = .09;
        c.fillStyle = g;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
    }
  }
};

const TextAnimations = {
  kinetic_slam(c, w, h, p, d, T) {
    let q = clamp(p / .35, 0, 1), sc = lerp(3, 1, easeOutBack(q)), sh = p < .4 ? (.4 - p) * 25 : 0;
    c.save();
    c.translate(w / 2 + (rand(p * 90) - .5) * sh, h * .48 + (rand(p * 75) - .5) * sh);
    c.scale(sc, sc);
    this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  cyber_scramble(c, w, h, p, d, T) {
    let chars = "01$#<>!&%*?ABCDEFGHXYZ_/", text = d.headline, res = Math.floor(p * text.length * 1.6), o = "";
    for (let i = 0; i < text.length; i++) o += text[i] === " " || text[i] === "\n" ? text[i] : i < res ? text[i] : chars[Math.floor(rand(i * 7 + Math.floor(p * 30)) * chars.length)];
    c.save();
    c.translate(w / 2, h * .48);
    c.strokeStyle = T.accent;
    c.lineWidth = 2;
    c.globalAlpha = .4 + .4 * Math.sin(p * 15);
    c.strokeRect(-w * .43, -h * .14, w * .86, h * .28);
    this.head(c, 0, 0, w * .82, o, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  neon_surge(c, w, h, p, d, T) {
    let f = p < .3 ? (rand(p * 60) > .4 ? 1 : .2) : 1;
    c.save();
    c.translate(w / 2, h * .48);
    c.globalAlpha = f;
    c.shadowColor = T.accent;
    c.shadowBlur = 35;
    this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  stagger_pop(c, w, h, p, d, T) {
    let words = d.headline.replace(/\n/g, " ").split(" "), pw = .6 / Math.max(1, words.length);
    c.save();
    c.translate(w / 2, h * .48);
    let fs = clamp(w / 8.5, 36, 68);
    c.font = `900 ${fs}px Space Grotesk,sans-serif`;
    c.textAlign = "center";
    c.textBaseline = "middle";
    let lh = fs * 1.15, start = -(words.length * lh) / 2 + lh / 2;
    words.forEach((word, i) => {
      let q = clamp((p - i * pw) / pw, 0, 1);
      if (q <= 0) return;
      let s = easeOutBack(q), a = d.accentWord && word.toUpperCase().includes(d.accentWord.toUpperCase());
      c.save();
      c.translate(0, start + i * lh);
      c.scale(s, s);
      c.fillStyle = a ? T.accent : T.text;
      if (a) { c.shadowColor = T.accent; c.shadowBlur = 22; }
      c.fillText(word.toUpperCase(), 0, 0);
      c.restore();
    });
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  isometric_3d(c, w, h, p, d, T) {
    let r = lerp(-.3, 0, easeOutCubic(clamp(p / .5, 0, 1)));
    c.save();
    c.translate(w / 2, h * .48);
    c.transform(1, r * .4, -r * .3, 1, 0, 0);
    for (let x = 12; x >= 1; x -= 3) {
      c.save();
      c.translate(-x, x);
      c.globalAlpha = .12;
      this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T, true);
      c.restore();
    }
    c.globalAlpha = 1;
    this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  glitch_rgb(c, w, h, p, d, T) {
    let sh = (p < .4 ? Math.sin(p * 25) : 0) * 14;
    c.save();
    c.translate(w / 2, h * .48);
    c.save();
    c.translate(-sh, 0);
    c.globalCompositeOperation = "screen";
    c.fillStyle = "#ff1744";
    this.plain(c, 0, 0, w * .84, d.headline);
    c.restore();
    c.save();
    c.translate(sh, 0);
    c.globalCompositeOperation = "screen";
    c.fillStyle = "#00e5ff";
    this.plain(c, 0, 0, w * .84, d.headline);
    c.restore();
    c.globalCompositeOperation = "source-over";
    this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  minimal_drift(c, w, h, p, d, T) {
    c.save();
    c.translate(w / 2, h * .48 - p * 15);
    this.head(c, 0, 0, w * .84, d.headline, d.accentWord, T);
    c.restore();
    this.meta(c, w, h, p, d, T);
  },
  head(c, x, y, maxW, text, accent, T, shadow = false) {
    let lines = (text || '').split("\\n").join("\n").split("\n"), fs = clamp(maxW / 8.5, 36, 68);
    c.font = `900 ${fs}px Space Grotesk,sans-serif`;
    c.textAlign = "center";
    c.textBaseline = "middle";
    let lh = fs * 1.15, yy = y - lines.length * lh / 2 + lh / 2;
    lines.forEach(line => {
      let a = accent && line.toUpperCase().includes(accent.toUpperCase());
      c.save();
      c.fillStyle = shadow ? "#000" : a ? T.accent : T.text;
      if (a && !shadow) { c.shadowColor = T.accent; c.shadowBlur = 24; }
      c.fillText(line.toUpperCase(), x, yy);
      c.restore();
      yy += lh;
    });
  },
  plain(c, x, y, maxW, text) {
    let lines = (text || '').split("\\n").join("\n").split("\n"), fs = clamp(maxW / 8.5, 36, 68);
    c.font = `900 ${fs}px Space Grotesk,sans-serif`;
    c.textAlign = "center";
    c.textBaseline = "middle";
    let lh = fs * 1.15, yy = y - lines.length * lh / 2 + lh / 2;
    lines.forEach(l => { c.fillText(l.toUpperCase(), x, yy); yy += lh; });
  },
  meta(c, w, h, p, d, T) {
    let q = clamp((p - .2) / .3, 0, 1);
    if (q <= 0) return;
    c.save();
    c.globalAlpha = easeOutCubic(q);
    if (d.tagline) {
      c.font = `700 16px JetBrains Mono,monospace`;
      c.textAlign = "center";
      c.textBaseline = "middle";
      let pad = 12, tw = c.measureText(d.tagline.toUpperCase()).width;
      c.fillStyle = T.tagBg || T.accent;
      c.fillRect(w / 2 - tw / 2 - pad, h * .23 - 14, tw + pad * 2, 28);
      c.fillStyle = "#04060b";
      c.fillText(d.tagline.toUpperCase(), w / 2, h * .23);
    }
    if (d.subtitle) {
      c.font = `600 20px Inter,sans-serif`;
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillStyle = "rgba(255,255,255,.85)";
      c.shadowColor = "rgba(0,0,0,.8)";
      c.shadowBlur = 10;
      c.fillText(d.subtitle, w / 2, h * .74);
    }
    c.restore();
  }
};

/* =========================================================================
   3. ANIMATION RENDER LOOP (GPU Offloaded via IntersectionObserver)
   ========================================================================= */
const activeCanvases = new Map();
const canvasObserver = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      activeCanvases.set(e.target, e.target._meta);
    } else {
      activeCanvases.delete(e.target);
      // Auto pause audio if card leaves view
      const card = e.target.closest('.feed-card');
      if (card) {
        const audio = card.querySelector('audio');
        if (audio && !audio.paused) {
          audio.pause();
          card.querySelector('.voice-pill')?.classList.remove('playing');
        }
      }
    }
  });
}, { threshold: .1 });

function loop(now) {
  let t = now / 1000;
  for (const [c, m] of activeCanvases) {
    let ctx = c.getContext("2d"), p = t % 3.2;
    (BACKGROUNDS[m.bg] || BACKGROUNDS.warp).draw(ctx, c.width, c.height, t, THEMES[m.theme] || THEMES.cyber);
    (TextAnimations[m.anim] || TextAnimations.kinetic_slam).call(TextAnimations, ctx, c.width, c.height, p, m.data, THEMES[m.theme] || THEMES.cyber);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Utility formatting
function escapeHTML(str) {
  return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
}
function sanitizeUrl(url) {
  if (!url) return null;
  try {
    const p = new URL(url.startsWith('http') ? url : `https://${url}`);
    return ['http:', 'https:'].includes(p.protocol) ? p.href : null;
  } catch (e) { return null; }
}

function card(post) {

          <span class="like-num">${post.likes_count || 0}</span>
        </button>
        <button class="social-btn" onclick="sharePost('${post.id}')" title="Share Permalink">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>

    <div class="card-info">
      <span>STYLE: ${(post.anim || 'kinetic_slam').replaceAll("_", " ").toUpperCase()}</span>

  `;

  let c = el.querySelector("canvas");

      headline: post.headline,
      accentWord: post.accent_word || post.accentWord,
      tagline: post.tagline,
      subtitle: post.subtitle
    },
    theme: post.theme,
    bg: post.bg || 'warp',
    anim: post.anim
  };
  canvasObserver.observe(c);
  return el;
}

async function load(reset = false) {
  if (isLoading || (!hasMore && !reset)) return;
  isLoading = true;

  if (reset) {
    feed.innerHTML = '';
    loadedIds.clear();
    currentPage = 0;
    hasMore = true;
  }

  if (sb) {
    const from = currentPage * BATCH;
    const to = from + BATCH - 1;

    try {
      const { data, error, count } = await sb
        .from('kinetic_wall')
        .select('*', { count: 'exact' })
        .order('is_pinned', { ascending: false })
        .order('created_at', { ascending: false })
        .range(from, to);

      if (error) throw error;

      if (count !== null) {
        document.getElementById("postCountLabel").textContent = `${count} INSCRIBED`;
      }

      if (!data || data.length === 0) {
        hasMore = false;
        document.getElementById("scrollSentinel").textContent = "✦ END OF PERMANENT STREAM ✦";
        return;
      }

      data.forEach(p => {
        if (!loadedIds.has(p.id)) {
          loadedIds.add(p.id);
          feed.appendChild(card(p));
        }
      });

      currentPage++;
    } catch (err) {
      console.error(err);
      toast("Error loading wall data");
    } finally {
      isLoading = false;
    }
  } else {
    // Fallback seed when Supabase keys are not yet configured
    document.getElementById("postCountLabel").textContent = "OFFLINE MODE";
    document.getElementById("scrollSentinel").textContent = "✦ SET SUPABASE KEYS TO SYNC ✦";
    isLoading = false;
  }
}

// Infinite scroll sentinel
new IntersectionObserver(es => {
  if (es[0].isIntersecting) load();
}, { rootMargin: "400px" }).observe(document.getElementById("scrollSentinel"));

/* =========================================================================
   5. VOICE RECORDING ENGINE & 1,000 CAP ENFORCEMENT
   ========================================================================= */
const MAX_VOICE_SLOTS = 1000;
let voiceCapReached = false;
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let recInterval = null;
let recSecs = 0;
let activeMimeType = '';

function getSafeMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg'];
  for (const t of types) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function checkVoiceCap() {
  if (!sb) return;
  const badge = document.getElementById("voiceSlotBadge");
  const btn = document.getElementById("recToggleBtn");
  const timer = document.getElementById("recTimer");

  try {
    const { count, error } = await sb
      .from('kinetic_wall')
      .select('*', { count: 'exact', head: true })
      .not('audio_url', 'is', null);

    if (error) throw error;
    const used = count || 0;
    const remaining = Math.max(0, MAX_VOICE_SLOTS - used);

    if (used >= MAX_VOICE_SLOTS) {
      voiceCapReached = true;
      badge.textContent = "CAP REACHED (1,000 / 1,000)";
      badge.style.color = "var(--crimson)";
      btn.disabled = true;
      btn.style.opacity = ".3";
      btn.style.cursor = "not-allowed";
      timer.textContent = "VOICE SLOTS EXHAUSTED";
    } else {
      voiceCapReached = false;
      badge.textContent = `${remaining} / 1,000 SLOTS LEFT`;
      badge.style.color = "var(--cyan)";
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
    }
  } catch (e) {
    badge.textContent = "FREE TIER (UP TO 1,000)";
  }
}

const recToggleBtn = document.getElementById("recToggleBtn");
const recTimer = document.getElementById("recTimer");
const audioPreview = document.getElementById("audioPreview");
const recIcon = document.getElementById("recIcon");

recToggleBtn.addEventListener("click", () => {
  if (voiceCapReached) {
    toast("Voice recording cap reached (1,000 slots full)");
    return;
  }
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
  } else {
    startRecording();
  }
});

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("HTTPS required for microphone access");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
    });

    audioChunks = [];
    activeMimeType = getSafeMimeType();
    const opts = {};
    if (activeMimeType) {
      opts.mimeType = activeMimeType;
      if (activeMimeType.includes('webm')) opts.audioBitsPerSecond = 16000;
    }

    mediaRecorder = new MediaRecorder(stream, opts);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(audioChunks, { type: activeMimeType || 'audio/webm' });
      if (audioPreview.src) URL.revokeObjectURL(audioPreview.src);
      audioPreview.src = URL.createObjectURL(recordedBlob);
      audioPreview.style.display = "block";
    };

    mediaRecorder.start();
    recSecs = 0;
    recToggleBtn.classList.add("recording");
    recIcon.innerHTML = `<rect x="6" y="6" width="12" height="12"/>`;

    recInterval = setInterval(() => {
      recSecs++;
      const m = String(Math.floor(recSecs / 60)).padStart(2, '0');
      const s = String(recSecs % 60).padStart(2, '0');
      recTimer.textContent = `Recording... (${m}:${s} / 01:00)`;
      if (recSecs >= 60) stopRecording();
    }, 1000);
  } catch (err) {
    toast("Microphone access denied");
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
  if (mediaRecorder && mediaRecorder.stream) {
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(recInterval);
  recToggleBtn.classList.remove("recording");
  recIcon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>`;
  recTimer.textContent = `Recorded (${recSecs}s) — ready to commit`;
}

let currentAudio = null;
function toggleVoice(id, pill) {
  const audio = pill.querySelector("audio");
  if (!audio) return;
  if (currentAudio && currentAudio !== audio) {
    currentAudio.pause();
    currentAudio.closest('.voice-pill')?.classList.remove('playing');
  }
  if (audio.paused) {
    audio.play().then(() => {
      pill.classList.add("playing");
      currentAudio = audio;
      if (sb) sb.rpc('increment_listens', { target_id: id }).catch(() => {});
    }).catch(() => toast("Audio playback blocked"));
  } else {
    audio.pause();
    pill.classList.remove("playing");
  }
}

const drawer = document.getElementById("creatorDrawer");
const pc = document.getElementById("previewCanvas");
const px = pc.getContext("2d");
let pTheme = "cyber", pBg = "warp";

function form() {
  return {

  };
}

function swatches(id, obj, initial, setter) {
  let g = document.getElementById(id);
  Object.entries(obj).forEach(([k, v]) => {
    let e = document.createElement("div");
    e.className = "swatch" + (k === initial ? " active" : "");
    e.innerHTML = `<div class="prev" style="background:linear-gradient(135deg,${v.accent || "#111"},${v.accent2 || "#222"})"></div>${v.name}`;
    e.onclick = () => {
      setter(k);
      [...g.children].forEach(x => x.classList.toggle("active", x === e));
    };
    g.appendChild(e);
  });
}

swatches("themeGrid", THEMES, pTheme, k => pTheme = k);
swatches("bgGrid", BACKGROUNDS, pBg, k => pBg = k);

function preview(now) {
  if (drawer.classList.contains("open")) {
    let d = form(), t = now / 1000, p = t % 3.2;
    BACKGROUNDS[pBg].draw(px, pc.width, pc.height, t, THEMES[pTheme]);
    (TextAnimations[d.anim] || TextAnimations.kinetic_slam).call(TextAnimations, px, pc.width, pc.height, p, d, THEMES[pTheme]);
  }
  requestAnimationFrame(preview);
}

btnCloseDrawer.onclick = () => {

btnCommit.onclick = async () => {
  let d = form();
  if (!d.headline) { toast("Headline text is required"); return; }

  btnCommit.disabled = true;
  btnCommit.textContent = "INSCRIBING FOREVER...";

  try {
    let audioUrl = null;

    if (recordedBlob && sb) {
      if (voiceCapReached) {
        toast("Voice cap reached. Saving text only.");
      } else {
        const ext = activeMimeType.includes('mp4') ? 'mp4' : 'webm';
        const fileKey = `voice_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
        const cleanType = (recordedBlob.type || activeMimeType || 'audio/webm').split(';')[0];

        const { error: uploadError } = await sb.storage
          .from('voice_notes')
          .upload(fileKey, recordedBlob, { contentType: cleanType });

        if (uploadError) throw uploadError;
        const { data: urlData } = sb.storage.from('voice_notes').getPublicUrl(fileKey);
        audioUrl = urlData.publicUrl;
      }
    }

    if (sb) {
      const { data: inserted, error: insertError } = await sb
        .from('kinetic_wall')
        .insert([{
          headline: d.headline,
          accent_word: d.accentWord,
          tagline: d.tagline,
          subtitle: d.subtitle,
          anim: d.anim,
          theme: pTheme,
          bg: pBg,
          outbound_url: d.url,
          audio_url: audioUrl
        }])
        .select()
        .single();

      if (insertError) throw insertError;
      if (inserted) feed.prepend(card(inserted));
    }

    drawer.classList.remove("open");
    resetCreatorForm();
    scrollTo({ top: 0, behavior: "smooth" });
    toast("✦ PERMANENTLY INSCRIBED ONTO WALL");
  } catch (err) {
    console.error(err);
    toast("Commit failed: " + err.message);
  } finally {
    btnCommit.disabled = false;
    btnCommit.textContent = "COMMIT TO WALL FOREVER";
  }
};

function resetCreatorForm() {
  inHead.value = "CREATE ONCE\nREMAINS FOREVER";
  inWord.value = "FOREVER";
  inSub.value = "Inscribed on the permanent kinetic wall ↓";
  inUrl.value = "";
  if (audioPreview.src) URL.revokeObjectURL(audioPreview.src);
  audioPreview.src = "";
  audioPreview.style.display = "none";
  recordedBlob = null;
  recTimer.textContent = "Tap to record pitch (00:00 / 01:00)";
}

let searchTimer = null;

document.getElementById("btnOpenSearch").onclick = () => searchDrawer.classList.add("open");
document.getElementById("btnCloseSearch").onclick = () => searchDrawer.classList.remove("open");
searchDrawer.onclick = e => { if (e.target === searchDrawer) searchDrawer.classList.remove("open"); };

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(performSearch, 300);
});

async function performSearch() {
  const q = searchInput.value.replace(/[^a-zA-Z0-9\s]/g, '').trim();
  if (!q || !sb) {
    searchResults.innerHTML = '';
    return;
  }
  try {
    const { data } = await sb
      .from('kinetic_wall')
      .select('id, serial_no, headline, tagline')
      .or(`headline.ilike.%${q}%,subtitle.ilike.%${q}%,tagline.ilike.%${q}%`)
      .limit(8);

    if (!data || data.length === 0) {
      searchResults.innerHTML = `<div style="font-family:var(--mono);font-size:11px;color:var(--dim);padding:10px;">NO MATCHES IN ARCHIVE</div>`;
      return;
    }

    searchResults.innerHTML = data.map(item => `
      <div style="padding:10px 14px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:.15s;" onclick="jumpToCard('${item.id}')">
        <div style="font-family:var(--mono);font-size:9.5px;color:var(--cyan)">#${String(item.serial_no || 1).padStart(4, '0')} · ${escapeHTML(item.tagline || 'STATEMENT')}</div>
        <div style="font-family:var(--disp);font-size:13px;font-weight:700;margin-top:2px;">${escapeHTML((item.headline || '').replace(/\n/g, ' '))}</div>
      </div>
    `).join('');
  } catch (e) {}
}

async function jumpToCard(id) {
  searchDrawer.classList.remove("open");
  const existing = document.querySelector(`[data-id="${id}"]`);
  if (existing) {
    existing.scrollIntoView({ behavior: 'smooth' });
  } else if (sb) {
    const { data } = await sb.from('kinetic_wall').select('*').eq('id', id).maybeSingle();
    if (data) {
      feed.prepend(card(data));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
}

/* =========================================================================
   9. PERMALINK INITIALIZER
   ========================================================================= */
window.addEventListener("DOMContentLoaded", async () => {
  const hash = window.location.hash;
  if (hash.startsWith("#p=") && sb) {
    const targetId = hash.replace("#p=", "").trim();
    if (targetId) {
      try {
        const { data } = await sb.from('kinetic_wall').select('*').eq('id', targetId).maybeSingle();
        if (data) {
          loadedIds.add(data.id);
          feed.appendChild(card(data));
        }
      } catch (e) {}
    }
  }
  load();
});
</script>
